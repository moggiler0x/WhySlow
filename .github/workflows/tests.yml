# Тесты и проверка базы знаний на всех трёх системах. Запускаются на каждый пул-реквест
# и коммит в main: битая запись в known.json или сломанная логика видны до релиза.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Библиотеки Qt для Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1
      - name: Зависимости
        # PySide6 нужен платным модулям whyslow/premium: окно и логика там в одном файле
        run: python -m pip install -r requirements.txt pytest
      - name: Тесты
        run: python -m pytest -q tests

  server:
    name: server (license)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Тесты сервера активации
        working-directory: server
        run: node --test test/*.test.mjs
