# Тесты и проверка базы знаний на всех трёх системах. Запускаются на каждый пул-реквест
# и коммит в main: битая запись в known.json или сломанная логика видны до релиза.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Зависимости
        run: python -m pip install psutil certifi pytest
      - name: Тесты
        run: python -m pytest -q tests
