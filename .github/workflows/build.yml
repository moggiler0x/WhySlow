# Сборка готовых приложений: WhySlow-Windows.exe, .dmg для Mac на Apple Silicon и на Intel,
# AppImage для Linux. Каждую собирает машина с этой ОС.
#
# В пул-реквестах файлы лежат во вкладке Actions → запуск → Artifacts, чтобы их можно было
# скачать и проверить. Из release.yml (с параметром tag) они прикрепляются к релизу.
name: Build

on:
  pull_request:
    paths: ["whyslow/**", "packaging/**", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Тег релиза, к которому прикрепить сборки"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS Apple Silicon, os: macos-14 }
          - { name: macOS Intel, os: macos-15-intel }
          # Старая система — старая glibc: AppImage пойдёт и на не самых свежих дистрибутивах
          - { name: Linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Библиотеки для Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3

      - name: Зависимости
        run: python -m pip install -r requirements.txt pyinstaller pillow

      - name: Собрать
        id: build
        run: python packaging/build.py

      - name: Сохранить файл
        if: ${{ !inputs.tag }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.file }}
          if-no-files-found: error

      - name: Прикрепить к релизу
        if: ${{ inputs.tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FILE: ${{ steps.build.outputs.file }}
        run: gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
