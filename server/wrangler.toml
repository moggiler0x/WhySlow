# Сервер активации подписки WhySlow (Cloudflare Workers, бесплатный тариф).
# Как развернуть — server/README.md.
name = "whyslow-license"
main = "src/index.js"
compatibility_date = "2025-09-01"

# База ключей. id появится после «npx wrangler kv namespace create LICENSES» — впишите его сюда.
[[kv_namespaces]]
binding = "LICENSES"
id = "7a53598674764533944b985b26c2b160"

# Сравнение с похожими ПК. id появится после «npx wrangler d1 create whyslow-compare»,
# таблицы — «npx wrangler d1 execute whyslow-compare --remote --file=compare-schema.sql».
[[d1_databases]]
binding = "COMPARE_DB"
database_name = "whyslow-compare"
database_id = "d8bbb5e0-93fd-46f2-911d-7e17ec206647"

[vars]
# Открытый ключ — тот же, что PUBLIC_KEY в whyslow/license.py
PUBLIC_KEY = "c8330862f212f43a65db9a709eed28a9b2929341a4c166785f656b6fc9735b25"
# Telegram-бот (необязательно): контакт для покупателей. Ваш id в Telegram — секрет OWNER_CHAT_ID
OWNER_CONTACT = ""

# Секреты задаются командой «npx wrangler secret put ИМЯ», не здесь:
#   PRIVATE_KEY      — вывод «python owner/keys.py server-secret» (ключ подписи)
#   SEAL_SECRET      — вывод «python owner/keys.py seal-secret» (секрет шифрования модулей)
#   ADMIN_TOKEN      — длинный случайный пароль для owner/keys.py
#   OWNER_CHAT_ID    — ваш числовой id в Telegram (секретом, чтобы не светить его в репозитории)
#   TG_TOKEN         — токен бота от @BotFather (если нужен бот)
#   TG_SECRET        — случайная строка, защищает адрес бота от чужих запросов
